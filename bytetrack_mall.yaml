# ByteTrack settings tuned for crowded mall scenes: a longer track buffer
# keeps a person's ID alive through brief occlusions (dense crowds), so
# dwell timers are not reset every time someone passes in front.
tracker_type: bytetrack
track_high_thresh: 0.4
track_low_thresh: 0.1
new_track_thresh: 0.5
track_buffer: 90
match_thresh: 0.85
fuse_score: True
